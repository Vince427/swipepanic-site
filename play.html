<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Swipe Panic — Jouer en Ligne</title>
  <meta name="description" content="Joue à Swipe Panic directement dans ton navigateur : swipe les dilemmes Red Flag / Green Flag et découvre les vraies tendances mondiales !">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Swipe Panic — Jouer en Ligne">
  <meta property="og:description" content="Green Flag 🟢 ou Red Flag 🚩 ? Vote sur les pires dilemmes et compare ton avis au monde entier !">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://swipepanic.app/play.html">
  <meta property="og:image" content="https://swipepanic.app/assets/og_image.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/icon.png">

  <style>
    :root {
      --bg: #0c0b14;
      --card-bg: #181628;
      --card-border: #2e2a4a;
      --text: #f3f3f8;
      --text-dim: #9490b8;
      --red: #ff3366;
      --green: #00e676;
      --orange: #ff9100;
      --purple: #7c4dff;
      --gold: #ffd700;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
    }

    /* Background Ambient Glows */
    .glow-left {
      position: absolute;
      top: -10%;
      left: -20%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(124, 77, 255, 0.15) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }
    .glow-right {
      position: absolute;
      bottom: -10%;
      right: -20%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(255, 51, 102, 0.12) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }

    /* Header */
    header {
      width: 100%;
      max-width: 480px;
      padding: 16px 20px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }

    .logo-badge {
      background: linear-gradient(135deg, var(--purple), var(--red));
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(124, 77, 255, 0.35);
    }

    .app-name {
      font-weight: 800;
      font-size: 19px;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #fff, #bbb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-select {
      background: #1f1c34;
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 20px;
      outline: none;
      cursor: pointer;
    }

    /* Game Stage */
    .stage {
      flex: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px 20px;
    }

    .pack-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(124, 77, 255, 0.15);
      border: 1px solid rgba(124, 77, 255, 0.35);
      color: #b39ddb;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    /* Cards Stack */
    .card-container {
      width: 100%;
      height: 380px;
      max-height: 52vh;
      position: relative;
      perspective: 1000px;
    }

    .card {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 24px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      touch-action: none;
      cursor: grab;
      transition: transform 0.05s ease-out, box-shadow 0.2s;
    }

    .card:active {
      cursor: grabbing;
    }

    .card-theme-tag {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card-text {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text);
      text-align: center;
      margin: auto 0;
      word-break: break-word;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
    }

    /* Swipe Overlay Stamps */
    .stamp {
      position: absolute;
      top: 24px;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transform: rotate(0deg);
      transition: opacity 0.1s ease;
    }

    .stamp-red {
      right: 20px;
      border: 3px solid var(--red);
      color: var(--red);
      transform: rotate(12deg);
      box-shadow: 0 0 15px rgba(255, 51, 102, 0.3);
    }

    .stamp-green {
      left: 20px;
      border: 3px solid var(--green);
      color: var(--green);
      transform: rotate(-12deg);
      box-shadow: 0 0 15px rgba(0, 230, 118, 0.3);
    }

    /* Consensus Popup Overlay */
    .consensus-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      width: 92%;
      background: #141224;
      border: 2px solid var(--purple);
      border-radius: 20px;
      padding: 20px 16px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 20px 50px rgba(0,0,0,0.85);
      z-index: 20;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .consensus-overlay.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .consensus-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #b39ddb;
      margin-bottom: 12px;
    }

    .consensus-bar-wrapper {
      height: 24px;
      background: #25213b;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      margin-bottom: 12px;
      border: 1px solid var(--card-border);
    }

    .consensus-fill-red {
      background: linear-gradient(90deg, #ff1744, #ff5252);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: white;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .consensus-fill-green {
      background: linear-gradient(90deg, #00e676, #69f0ae);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: #0b2210;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .consensus-flags {
      display: flex;
      justify-content: space-around;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
    }

    /* Action Buttons */
    .controls {
      width: 100%;
      max-width: 420px;
      padding: 10px 20px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 10;
    }

    .btn-action {
      flex: 1;
      height: 56px;
      border-radius: 18px;
      border: none;
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-action:active {
      transform: scale(0.95);
    }

    .btn-red {
      background: linear-gradient(135deg, #ff1744, #d50000);
      color: white;
    }

    .btn-green {
      background: linear-gradient(135deg, #00e676, #00c853);
      color: #0c2010;
    }

    /* Recap Screen (End of session) */
    .recap-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      z-index: 30;
      padding: 30px 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-y: auto;
    }

    .recap-screen.active {
      display: flex;
    }

    .recap-card {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border: 2px solid var(--purple);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(124, 77, 255, 0.2);
    }

    .recap-title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #ffd700, #ff9100);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .recap-score {
      font-size: 42px;
      font-weight: 900;
      color: var(--text);
      margin: 12px 0 6px;
    }

    .recap-desc {
      font-size: 14px;
      color: var(--text-dim);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .cta-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
    }

    .btn-store {
      background: linear-gradient(135deg, #7c4dff, #ff3366);
      color: white;
      text-decoration: none;
      height: 58px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 10px 25px rgba(255, 51, 102, 0.4);
      transition: transform 0.1s;
    }

    .btn-store:active {
      transform: scale(0.97);
    }

    .btn-replay {
      background: #1f1c34;
      border: 1px solid var(--card-border);
      color: var(--text);
      height: 48px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .link-home {
      text-align: center;
      font-size: 13px;
      color: var(--text-dim);
      text-decoration: none;
      margin-top: 6px;
    }

    /* Loading Spinner */
    .loader {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <div class="glow-left"></div>
  <div class="glow-right"></div>

  <!-- Top Header -->
  <header>
    <a href="index.html" class="brand">

    </a>
    <div class="header-controls">
      <select id="countrySelect" class="lang-select" title="">
        <!-- Filled at runtime from the ISO list: every country in the world. -->
      </select>
      <select id="langSelect" class="lang-select">
        <option value="fr">🇫🇷 FR</option>
        <option value="en">🇬🇧 EN</option>
        <option value="es">🇪🇸 ES</option>

      </select>
    </div>
  </header>

  <!-- Main Game Stage -->
  <div class="stage">
    <div id="packPill" class="pack-pill">⚡ Mini-Jeu Web</div>

    <div class="card-container" id="cardContainer">
      <div class="loader" id="loader">Chargement des dilemmes...</div>
    </div>

    <!-- Live Consensus Popup -->
    <div class="consensus-overlay" id="consensusOverlay">
      <div class="consensus-title" id="consensusTitle">🌍 Consensus Mondial</div>
      <div class="consensus-bar-wrapper">
        <div class="consensus-fill-red" id="consensusRed">50%</div>
        <div class="consensus-fill-green" id="consensusGreen">50%</div>
      </div>
      <div class="consensus-flags" id="consensusFlags"></div>
    </div>
  </div>

  <!-- Action Controls -->
  <div class="controls" id="controls">
    <button class="btn-action btn-red" id="btnRed" aria-label="Action Gauche">
      <span id="iconRed">🚩</span> <span id="labelRed">RED FLAG</span>
    </button>
    <button class="btn-action btn-green" id="btnGreen" aria-label="Action Droite">
      <span id="iconGreen">🟢</span> <span id="labelGreen">GREEN FLAG</span>
    </button>
  </div>

  <!-- End of Session Recap Modal -->
  <div class="recap-screen" id="recapScreen">
    <div style="height: 10px;"></div>
    <div class="recap-card">
      <div class="recap-title" id="recapTitle">🏆 RECAP SESSION</div>
      <div class="recap-score" id="recapScore">84%</div>
      <p class="recap-desc" id="recapText">
        Tu es en phase avec le consensus mondial ! Tes amis auraient-ils fait les mêmes choix ?
      </p>
      <div style="font-size: 13px; color: #b39ddb; margin-top: 10px;" id="recapCounts">
        🚩 3 Red Flags • 🟢 2 Green Flags
      </div>
    </div>

    <div class="cta-container">
      <a href="https://play.google.com/store/apps/details?id=com.swipepanic.swipe_panic" target="_blank" class="btn-store" id="ctaStore">
        📲 Télécharger l'App Gratuite
      </a>
      <button class="btn-replay" id="btnReplay">🔄 Rejouer 5 cartes</button>
      <a href="index.html" class="link-home" id="linkHome">Retour à l'accueil</a>
    </div>
  </div>

  <script>
    'use strict';

    // Complete 6-language translations dictionary
    // ---------------------------------------------------------------
    // Country of the voter.
    //
    // Same rule as the live: the country is DECLARED by the person, never
    // inferred from an IP or from the language. Language and country are two
    // separate notions - a locale like "fr" carries no region.
    //
    // The consensus data is keyed by flag emoji, which is derivable from the
    // ISO 3166-1 alpha-2 code, and the country NAME comes from the browser via
    // Intl.DisplayNames in the active language. So the whole world fits in one
    // list of codes, translated for free in every language.
    // ---------------------------------------------------------------
    const COUNTRY_CODES = (
      'AD AE AF AG AL AM AO AR AT AU AZ BA BB BD BE BF BG BH BI BJ BN BO BR BS ' +
      'BT BW BY BZ CA CD CF CG CH CI CL CM CN CO CR CU CV CY CZ DE DJ DK DM DO ' +
      'DZ EC EE EG ER ES ET FI FJ FM FR GA GB GD GE GH GM GN GQ GR GT GW GY HN ' +
      'HR HT HU ID IE IL IN IQ IR IS IT JM JO JP KE KG KH KI KM KN KP KR KW KZ ' +
      'LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MG MH MK ML MM MN MR MT MU ' +
      'MV MW MX MY MZ NA NE NG NI NL NO NP NR NZ OM PA PE PG PH PK PL PT PW PY ' +
      'QA RO RS RU RW SA SB SC SD SE SG SI SK SL SM SN SO SR SS ST SV SY SZ TD ' +
      'TG TH TJ TL TM TN TO TR TT TV TW TZ UA UG US UY UZ VA VC VE VN VU WS YE ' +
      'ZA ZM ZW'
    ).split(' ');

    const COUNTRY_STORAGE_KEY = 'sp_country';

    function flagFromCode(code) {
      return String.fromCodePoint(
        ...[...code].map((ch) => 0x1f1e6 + ch.charCodeAt(0) - 65),
      );
    }

    // Flag emoji -> ISO code, so a stored flag survives and stays comparable
    // with the flags the live writes into the consensus file.
    const CODE_BY_FLAG = {};
    for (const code of COUNTRY_CODES) CODE_BY_FLAG[flagFromCode(code)] = code;

    function countryName(code, locale) {
      try {
        const names = new Intl.DisplayNames([locale], { type: 'region' });
        return names.of(code) || code;
      } catch (err) {
        return code;
      }
    }

    function readStoredCountry() {
      try {
        const raw = localStorage.getItem(COUNTRY_STORAGE_KEY);
        if (raw && CODE_BY_FLAG[raw]) return raw;
      } catch (err) {
        // Private browsing or blocked storage: fall through to "unset".
      }
      return '';
    }

    function storeCountry(flag) {
      try {
        localStorage.setItem(COUNTRY_STORAGE_KEY, flag);
      } catch (err) {
        // Non-fatal: the vote still carries the country for this session.
      }
    }

    let currentCountry = readStoredCountry();

    function buildCountrySelect(locale) {
      const select = document.getElementById('countrySelect');
      if (!select) return;
      const t = i18n[locale] || i18n.en;

      const entries = COUNTRY_CODES.map((code) => ({
        code,
        flag: flagFromCode(code),
        name: countryName(code, locale),
      })).sort((a, b) => a.name.localeCompare(b.name, locale));

      const options = [`<option value="">${t.countryPrompt}</option>`];
      for (const entry of entries) {
        options.push(
          `<option value="${entry.flag}">${entry.flag} ${entry.name}</option>`,
        );
      }
      select.innerHTML = options.join('');
      select.value = currentCountry;
      select.title = t.countryPrompt;
    }

    // ---------------------------------------------------------------
    // Vote recording.
    //
    // Endpoint is configuration, not code: while SP_VOTE_ENDPOINT is empty
    // nothing is sent and the page behaves exactly as before. Point it at a
    // collector and votes start flowing, with the provenance the contract
    // requires (source: web_votes, declared country).
    // ---------------------------------------------------------------
    // The collector is a Google Form response endpoint: public by design, which
    // is exactly why no token has to live in this page. vote_config.json holds
    // the ids; while it is absent nothing is sent and the game is unchanged.
    let voteConfig = null;

    async function loadVoteConfig() {
      try {
        const res = await fetch('./vote_config.json', { cache: 'no-store' });
        if (!res.ok) return;
        const config = await res.json();
        if (!config.formId || String(config.formId).includes('REPLACE')) return;
        voteConfig = config;
      } catch (err) {
        // No collector configured. Voting still works, it just is not counted.
      }
    }

    // Votes are buffered and sent as one batch per session: one request instead
    // of one per swipe. sendBeacon keeps the batch alive when the tab closes,
    // so a player who leaves on the last card still counts.
    let voteBuffer = [];

    function submitVote(cardId, direction) {
      voteBuffer.push({
        card_id: cardId,
        choice: direction === 'green' ? 'accept' : 'reject',
        country: currentCountry || '',
        lang: currentLang,
      });
    }

    function flushVotes() {
      if (!voteConfig || voteBuffer.length === 0) return;

      const url = `https://docs.google.com/forms/d/e/${voteConfig.formId}/formResponse`;
      const fields = voteConfig.entries || {};
      const pending = voteBuffer;
      voteBuffer = [];

      for (const vote of pending) {
        const body = new URLSearchParams();
        for (const [key, entryId] of Object.entries(fields)) {
          if (vote[key] !== undefined && vote[key] !== '') body.append(entryId, vote[key]);
        }
        if ([...body.keys()].length === 0) continue;

        try {
          if (navigator.sendBeacon) {
            navigator.sendBeacon(
              url,
              new Blob([body.toString()], {
                type: 'application/x-www-form-urlencoded',
              }),
            );
          } else {
            // no-cors: the form accepts the write but returns an opaque
            // response. There is nothing to read back, and nothing to leak.
            fetch(url, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: body.toString(),
              keepalive: true,
            }).catch(() => {});
          }
        } catch (err) {
          // Silent by design: a collector outage is not the player's problem.
        }
      }
    }

    window.addEventListener('pagehide', flushVotes);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') flushVotes();
    });

    const i18n = {
      fr: {
        loading: "Chargement des cartes...",
        consensusTitleMeasured: "🌍 Consensus Mondial",
        consensusTitleNeutral: "⏳ Pas encore assez de votes",
        consensusSubtitleNeutral: "À toi d'ouvrir le débat !",
        redFlag: "RED FLAG",
        greenFlag: "GREEN FLAG",
        falseLabel: "FAUX",
        trueLabel: "VRAI",
        truthLabel: "VÉRITÉ",
        dareLabel: "ACTION",
        swipeOrClick: "Swipe ou clique",
        leftHint: "👈 Gauche",
        rightHint: "Droite 👉",
        recapTitle: "🏆 RECAP SESSION",
        recapAgreedDesc: "Tu es en phase avec le consensus mondial sur {count} cartes mesurées !",
        recapNeutralDesc: "Tes choix de la session. En soirée, tes amis auraient-ils assumé les mêmes réponses ?",
        ctaStore: "📲 Télécharger l'App Gratuite",
        btnReplay: "🔄 Rejouer 5 cartes",
        linkHome: "Retour à l'accueil",
        packMini: "⚡ Mini-Jeu Web",
        errorLoad: "Erreur de chargement. Recharge la page.",
        countryPrompt: "🌍 Ton pays",
        countryYours: "Ton pays",
        countryNoData: "Pas encore de votes pour ton pays — le tien comptera.",
        countryCompare: "Comparer les pays ({count})",
        countryPick: "Choisis ton pays pour qu'il compte",
        votesLabel: "{count} votes"
      },
      en: {
        loading: "Loading cards...",
        consensusTitleMeasured: "🌍 Global Consensus",
        consensusTitleNeutral: "⏳ Not enough votes yet",
        consensusSubtitleNeutral: "You're opening the debate!",
        redFlag: "RED FLAG",
        greenFlag: "GREEN FLAG",
        falseLabel: "FALSE",
        trueLabel: "TRUE",
        truthLabel: "TRUTH",
        dareLabel: "DARE",
        swipeOrClick: "Swipe or click",
        leftHint: "👈 Left",
        rightHint: "Right 👉",
        recapTitle: "🏆 SESSION RECAP",
        recapAgreedDesc: "You align with global opinion on {count} measured dilemmas!",

        recapTitle: "🏆 RESUMO DA SESSÃO",

        countryCompare: "Comparar países ({count})",
        countryPick: "Escolhe o teu país para que conte",
        votesLabel: "{count} votos"
      }
    };

    // State Variables
    let currentLang = 'fr';
    let allCards = [];
    let consensusData = {};
    let sessionQueue = [];
    let swipedCount = 0;
    let redCount = 0;
    let greenCount = 0;
    let measuredAgreedCount = 0;
    let measuredTotalCount = 0;
    let isTransitioning = false;
    let maxSessionCards = 5;

    // Detect Language from URL or Browser
    function detectLocale() {
      const params = new URLSearchParams(window.location.search);
      const urlLang = params.get('lang');
      if (urlLang && i18n[urlLang]) return urlLang;
      const navLang = (navigator.language || navigator.userLanguage || 'fr').substring(0, 2).toLowerCase();
      return i18n[navLang] ? navLang : 'fr';
    }

    currentLang = detectLocale();
    document.getElementById('langSelect').value = currentLang;

    // UI Elements
    const cardContainer = document.getElementById('cardContainer');
    const consensusOverlay = document.getElementById('consensusOverlay');
    const consensusTitle = document.getElementById('consensusTitle');
    const consensusRed = document.getElementById('consensusRed');
    const consensusGreen = document.getElementById('consensusGreen');
    const consensusFlags = document.getElementById('consensusFlags');
    const btnRed = document.getElementById('btnRed');
    const btnGreen = document.getElementById('btnGreen');
    const labelRed = document.getElementById('labelRed');
    const labelGreen = document.getElementById('labelGreen');
    const iconRed = document.getElementById('iconRed');
    const iconGreen = document.getElementById('iconGreen');
    const recapScreen = document.getElementById('recapScreen');

    function applyTranslations() {
      const t = i18n[currentLang] || i18n.fr;
      document.getElementById('ctaStore').textContent = t.ctaStore;
      document.getElementById('btnReplay').textContent = t.btnReplay;
      document.getElementById('linkHome').textContent = t.linkHome;
      document.getElementById('packPill').textContent = t.packMini;

      // Country names follow the active language; the CHOSEN country does not.
      buildCountrySelect(currentLang);
      
      const topCard = cardContainer.querySelector('.card');
      if (topCard && topCard._cardData) {
        updateCardAndButtonsForMode(topCard._cardData, topCard);
      }
    }

    function updateCardAndButtonsForMode(cardData, cardEl) {
      const t = i18n[currentLang] || i18n.fr;
      const mode = cardData.mode || (cardData.type === 'quiz' ? 'quiz' : (cardData.theme === 'party' ? 'social' : 'classic'));
      
      if (mode === 'quiz') {
        iconRed.textContent = '❌';
        labelRed.textContent = t.falseLabel;
        iconGreen.textContent = '✅';
        labelGreen.textContent = t.trueLabel;
        if (cardEl) {
          cardEl.querySelector('.stamp-red').textContent = t.falseLabel;
          cardEl.querySelector('.stamp-green').textContent = t.trueLabel;
        }
      } else if (mode === 'social') {
        iconRed.textContent = '👁️';
        labelRed.textContent = t.truthLabel;
        iconGreen.textContent = '⚡';
        labelGreen.textContent = t.dareLabel;
        if (cardEl) {
          cardEl.querySelector('.stamp-red').textContent = t.truthLabel;
          cardEl.querySelector('.stamp-green').textContent = t.dareLabel;
        }
      } else {
        iconRed.textContent = '🚩';
        labelRed.textContent = t.redFlag;
        iconGreen.textContent = '🟢';
        labelGreen.textContent = t.greenFlag;
        if (cardEl) {
          cardEl.querySelector('.stamp-red').textContent = t.redFlag;
          cardEl.querySelector('.stamp-green').textContent = t.greenFlag;
        }
      }

      if (cardEl) {
        cardEl.querySelector('.card-text').textContent = cardData.texts[currentLang] || cardData.texts.en || cardData.texts.fr || '';
        const hintLeft = cardEl.querySelector('.hint-left');
        const hintCenter = cardEl.querySelector('.hint-center');
        const hintRight = cardEl.querySelector('.hint-right');
        if (hintLeft) hintLeft.textContent = t.leftHint;
        if (hintCenter) hintCenter.textContent = t.swipeOrClick;
        if (hintRight) hintRight.textContent = t.rightHint;
      }
    }

    document.getElementById('countrySelect').addEventListener('change', (e) => {
      currentCountry = e.target.value || '';
      if (currentCountry) storeCountry(currentCountry);
    });

    document.getElementById('langSelect').addEventListener('change', (e) => {
      currentLang = e.target.value;
      applyTranslations();
    });

    // Load Data
    async function initGame() {
      try {
        // Fire and forget: a missing collector must never delay the game.
        loadVoteConfig();

        const [catalogRes, consensusRes] = await Promise.all([
          fetch('./official_card_catalog.json').then(r => r.json()),
          fetch('./data/live_consensus.json').then(r => r.json()).catch(() => ({}))
        ]);

        consensusData = consensusRes || {};
        
        // Flatten all public/safe cards
        allCards = [];
        const rawList = catalogRes.cards || [];
        if (rawList.length > 0) {
          allCards = rawList.filter(c => c.live_tier !== 'forbidden' && c.live_tier !== 'risky');
        } else if (catalogRes.packs) {
          Object.values(catalogRes.packs).forEach(p => {
            if (p.cards) allCards.push(...p.cards);
          });
        }

        prepareSession();
      } catch (err) {
        console.error("Init failed:", err);
        document.getElementById('loader').textContent = (i18n[currentLang] || i18n.fr).errorLoad;
      }
    }

    function prepareSession() {
      swipedCount = 0;
      redCount = 0;
      greenCount = 0;
      measuredAgreedCount = 0;
      measuredTotalCount = 0;
      isTransitioning = false;
      recapScreen.classList.remove('active');

      const params = new URLSearchParams(window.location.search);
      const targetCardsParam = params.get('cards');
      const targetCardId = params.get('card');
      const targetPack = params.get('pack');

      sessionQueue = [];

      // Support exact carousel card lists: ?cards=id1,id2,id3
      if (targetCardsParam) {
        const ids = targetCardsParam.split(',').map(s => s.trim()).filter(Boolean);
        for (const id of ids) {
          const card = allCards.find(c => c.id === id);
          if (card) sessionQueue.push(card);
        }
        if (sessionQueue.length > 0) {
          maxSessionCards = sessionQueue.length;
          renderTopCard();
          return;
        }
      }

      maxSessionCards = 5;
      let pool = [...allCards];
      if (targetPack) {
        pool = pool.filter(c => c.packId === targetPack || (c.id && c.id.startsWith(targetPack)));
      }
      if (pool.length === 0) pool = [...allCards];

      // Prioritize cards with measured consensus for random sessions
      const poolWithStats = pool.filter(c => consensusData[c.id] && (consensusData[c.id].reject !== undefined));
      const poolWithoutStats = pool.filter(c => !consensusData[c.id]);

      poolWithStats.sort(() => Math.random() - 0.5);
      poolWithoutStats.sort(() => Math.random() - 0.5);

      // If specific card requested via deep link, put it first!
      if (targetCardId) {
        const priorityCard = allCards.find(c => c.id === targetCardId);
        if (priorityCard) {
          sessionQueue.push(priorityCard);
          poolWithStats.filter(c => c.id !== targetCardId);
          poolWithoutStats.filter(c => c.id !== targetCardId);
        }
      }

      // Fill remaining session cards (prioritizing measured cards)
      while (sessionQueue.length < maxSessionCards && poolWithStats.length > 0) {
        sessionQueue.push(poolWithStats.pop());
      }
      while (sessionQueue.length < maxSessionCards && poolWithoutStats.length > 0) {
        sessionQueue.push(poolWithoutStats.pop());
      }

      renderTopCard();
    }

    function renderTopCard() {
      cardContainer.innerHTML = '';
      if (sessionQueue.length === 0 || swipedCount >= maxSessionCards) {
        showRecap();
        return;
      }

      const cardData = sessionQueue[0];
      const cardEl = document.createElement('div');
      cardEl.className = 'card';
      cardEl._cardData = cardData;

      const t = i18n[currentLang] || i18n.fr;
      const text = cardData.texts[currentLang] || cardData.texts.en || cardData.texts.fr || '';
      const theme = cardData.theme || 'dilemma';

      cardEl.innerHTML = `
        <div class="stamp stamp-green">GREEN FLAG</div>
        <div class="stamp stamp-red">RED FLAG</div>
        <div class="card-theme-tag">${theme} • #${swipedCount + 1}/${maxSessionCards}</div>
        <div class="card-text">${text}</div>
        <div class="card-footer">
          <span class="hint-left">${t.leftHint}</span>
          <span class="hint-center">${t.swipeOrClick}</span>
          <span class="hint-right">${t.rightHint}</span>
        </div>
      `;

      cardContainer.appendChild(cardEl);
      updateCardAndButtonsForMode(cardData, cardEl);
      attachSwipePhysics(cardEl, cardData);
      isTransitioning = false;
    }

    function attachSwipePhysics(card, cardData) {
      let isDragging = false;
      let startX = 0, startY = 0;
      let currentX = 0, currentY = 0;
      const stampGreen = card.querySelector('.stamp-green');
      const stampRed = card.querySelector('.stamp-red');

      function onStart(x, y) {
        if (isTransitioning) return;
        isDragging = true;
        startX = x;
        startY = y;
        card.style.transition = 'none';
      }

      function onMove(x, y) {
        if (!isDragging || isTransitioning) return;
        currentX = x - startX;
        currentY = y - startY;
        const rotate = currentX * 0.08;
        card.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;

        const normalized = Math.min(Math.abs(currentX) / 100, 1);
        if (currentX > 0) {
          stampGreen.style.opacity = normalized;
          stampRed.style.opacity = 0;
        } else {
          stampRed.style.opacity = normalized;
          stampGreen.style.opacity = 0;
        }
      }

      function onEnd() {
        if (!isDragging || isTransitioning) return;
        isDragging = false;
        const threshold = 80;

        if (currentX > threshold) {
          performSwipe(card, cardData, 'green');
        } else if (currentX < -threshold) {
          performSwipe(card, cardData, 'red');
        } else {
          card.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
          card.style.transform = 'translate(0px, 0px) rotate(0deg)';
          stampGreen.style.opacity = 0;
          stampRed.style.opacity = 0;
        }
      }

      card.addEventListener('pointerdown', e => onStart(e.clientX, e.clientY));
      window.addEventListener('pointermove', e => onMove(e.clientX, e.clientY));
      window.addEventListener('pointerup', onEnd);
      window.addEventListener('pointercancel', onEnd);
    }

    function performSwipe(cardEl, cardData, direction) {
      if (isTransitioning) return;
      isTransitioning = true;

      const flyX = direction === 'green' ? window.innerWidth + 200 : -window.innerWidth - 200;
      cardEl.style.transition = 'transform 0.4s ease-out, opacity 0.3s';
      cardEl.style.transform = `translate(${flyX}px, 50px) rotate(${direction === 'green' ? 30 : -30}deg)`;
      cardEl.style.opacity = '0';

      swipedCount++;
      if (direction === 'green') greenCount++;
      else redCount++;

      // Record the vote before showing the result, so a player who closes the
      // page on the reveal still counts.
      submitVote(cardData.id, direction);

      // Show Honest Consensus Stats Popup
      showConsensus(cardData.id, direction);

      setTimeout(() => {
        sessionQueue.shift();
        renderTopCard();
      }, 1200);
    }

    function showConsensus(cardId, userChoice) {
      const t = i18n[currentLang] || i18n.fr;
      const stat = consensusData[cardId];
      const hasRealConsensus = stat && (stat.reject !== undefined) && (stat.accept !== undefined);

      if (hasRealConsensus) {
        const rejectPct = stat.reject;
        const acceptPct = stat.accept;

        measuredTotalCount++;
        if ((userChoice === 'red' && rejectPct >= 50) || (userChoice === 'green' && acceptPct >= 50)) {
          measuredAgreedCount++;
        }

        consensusTitle.textContent = t.consensusTitleMeasured;
        consensusRed.style.width = `${rejectPct}%`;
        consensusRed.textContent = `🚩 ${rejectPct}%`;
        consensusGreen.style.width = `${acceptPct}%`;
        consensusGreen.textContent = `🟢 ${acceptPct}%`;

        // Every country actually present in the data, none invented.
        // A country with no measurement is OMITTED, never given the world
        // figure: showing the global number under a flag would claim a
        // measurement that was never taken.
        const c = stat.countries || {};
        const present = Object.keys(c);

        // The voter's own country first when it has data - that is the
        // comparison people came for.
        present.sort((a, b) => {
          if (a === currentCountry) return -1;
          if (b === currentCountry) return 1;
          return (c[b].sample_size || 0) - (c[a].sample_size || 0) || a.localeCompare(b);
        });

        const parts = present.map((flag) => {
          const entry = c[flag];
          const mine = flag === currentCountry ? ' style="font-weight:900"' : '';
          const n = Number.isInteger(entry.sample_size)
            ? ` <small>(${t.votesLabel.replace('{count}', entry.sample_size)})</small>`
            : '';
          return `<span${mine}>${flag} 🚩 ${entry.reject}%${n}</span>`;
        });

        // The voter's country is missing from the data: say so plainly, and
        // turn it into the reason to vote rather than into a fake number.
        if (currentCountry && !c[currentCountry]) {
          parts.push(`<span>${currentCountry} ${t.countryNoData}</span>`);
        } else if (!currentCountry) {
          parts.push(`<span>${t.countryPick}</span>`);
        }

        consensusFlags.style.display = 'flex';
        consensusFlags.innerHTML = parts.join('');
      } else {
        // Honest neutral state when not enough votes yet
        consensusTitle.textContent = t.consensusTitleNeutral;
        consensusRed.style.width = '50%';
        consensusRed.textContent = '50%';
        consensusGreen.style.width = '50%';
        consensusGreen.textContent = '50%';
        consensusFlags.style.display = 'block';
        consensusFlags.innerHTML = `<span>${t.consensusSubtitleNeutral}</span>`;
      }

      consensusOverlay.classList.add('visible');
      setTimeout(() => {
        consensusOverlay.classList.remove('visible');
      }, 1100);
    }

    // Button controls
    btnRed.addEventListener('click', () => {
      if (isTransitioning) return;
      const topCard = cardContainer.querySelector('.card');
      if (topCard && topCard._cardData) performSwipe(topCard, topCard._cardData, 'red');
    });

    btnGreen.addEventListener('click', () => {
      if (isTransitioning) return;
      const topCard = cardContainer.querySelector('.card');
      if (topCard && topCard._cardData) performSwipe(topCard, topCard._cardData, 'green');
    });

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if (isTransitioning) return;
      if (e.key === 'ArrowLeft') btnRed.click();
      else if (e.key === 'ArrowRight') btnGreen.click();
    });

    function showRecap() {
      const t = i18n[currentLang] || i18n.fr;
      document.getElementById('recapTitle').textContent = t.recapTitle;

      if (measuredTotalCount > 0) {
        const agreementPct = Math.round((measuredAgreedCount / measuredTotalCount) * 100);
        document.getElementById('recapScore').textContent = `${agreementPct}%`;
        document.getElementById('recapText').textContent = t.recapAgreedDesc.replace('{count}', `${measuredAgreedCount}/${measuredTotalCount}`);
      } else {
        document.getElementById('recapScore').textContent = `🎯`;
        document.getElementById('recapText').textContent = t.recapNeutralDesc;
      }

      document.getElementById('recapCounts').textContent = `🚩 ${redCount} • 🟢 ${greenCount}`;
      // The session is over: send the batch now rather than hoping for pagehide.
      flushVotes();
      recapScreen.classList.add('active');
    }

    document.getElementById('btnReplay').addEventListener('click', () => {
      prepareSession();
    });

    // Launch
    initGame();
  </script>
