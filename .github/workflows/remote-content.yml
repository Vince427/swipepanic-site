name: Remote content

on:
  schedule:
    # Weekly pack rotation.
    - cron: '17 3 * * 1'
    # Web votes: aggregated every 15m. Batching is what makes "git as the
    # database" viable - one commit per batch, not one per vote.
    - cron: '*/15 * * * *'
  workflow_dispatch:
  # Both triggers list data/live_consensus.json on purpose: deploy_consensus.js
  # tells a human to commit that file by hand, so the path a person actually
  # takes must be validated too - not only the paths the bots take. Without the
  # push trigger, a direct commit to main reaches the public site unchecked.
  push:
    branches: [main]
    paths: &content_paths
      - 'manifest.json'
      - 'daily.json'
      - 'daily_pool.json'
      - 'cards_patch.json'
      - 'blacklist.txt'
      - 'blacklist.json'
      - 'data/live_consensus.json'
      - 'scripts/**'
      - '.github/workflows/remote-content.yml'
  pull_request:
    paths: *content_paths

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check acquisition.js
      - run: node --check site.js
      - run: node --check scripts/remote_content_rules.js
      - run: node --check scripts/validate_remote_content.js
      - run: node --check scripts/generate_daily.js
      - run: node --check scripts/play_contract.test.js
      - run: node --check scripts/aggregate_web_votes.js
      - run: node --test scripts/play_contract.test.js
      - run: node --test scripts/aggregate_web_votes.test.js
      - run: node --test scripts/live_consensus_validation.test.js
      - run: node --test scripts/acquisition_links.test.js
      - run: node --test scripts/daily_dilemma.test.js
      - run: node --check scripts/check_dilemma_inventory.js
      - run: node scripts/validate_remote_content.js

  generate-weekly:
    if: github.event.schedule == '17 3 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/generate_daily.js
      - run: node scripts/validate_remote_content.js
      - name: Check dilemma inventory & stock
        id: dilemma_inventory
        run: node scripts/check_dilemma_inventory.js
      - name: Alert via GitHub Issue if stock <= 60 days
        if: steps.dilemma_inventory.outputs.alert_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_ISSUE=$(gh issue list --search "⚠️ [Swipe Panic] Stock Dilemmes : Fin de cycle proche" --json number -q '.[0].number')
          if [ -z "$EXISTING_ISSUE" ]; then
            gh issue create \
              --title "⚠️ [Swipe Panic] Stock Dilemmes : Fin de cycle proche (${{ steps.dilemma_inventory.outputs.days_remaining }} jours restants)" \
              --body "Bonjour Vince ! 👋

Le stock de dilemmes 50/50 arrive bientôt à la fin de son cycle annuel (365 jours).

- **Cycle en cours** : Année ${{ steps.dilemma_inventory.outputs.current_cycle }}
- **Jour actuel** : ${{ steps.dilemma_inventory.outputs.current_day }} / 365
- **Jours restants avant boucle** : **${{ steps.dilemma_inventory.outputs.days_remaining }} jours**

Il est temps de générer ou préparer les nouvelles cartes pour l'année suivante dans `daily_impossible.json` et dans l'app !
*(Note : Même si aucune carte n'est ajoutée, l'algorithme est conçu pour reboucler sans aucun bug ni crash sur l'année 1).*
"
          else
            echo "An alert issue already exists (#$EXISTING_ISSUE), skipping duplicate creation."
          fi
      - name: Commit weekly content
        run: |
          if git diff --quiet -- daily.json; then
            echo "daily.json already current for this week"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add daily.json
            git commit -m "Update weekly remote content"
            git pull --rebase
            git push
          fi

  aggregate-web-votes:
    # Its own cron only: running alongside generate-weekly would mean two jobs
    # pushing the same branch at the same time.
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No-op while vote_config.json is absent, so this job is safe to enable
      # before the form exists.
      - run: node scripts/aggregate_web_votes.js

      # The aggregate must never be published without passing the same
      # validation as everything else.
      - run: node scripts/validate_remote_content.js

      - name: Commit aggregated votes
        run: |
          if git diff --quiet -- data/live_consensus.json daily_impossible.json; then
            echo "no new web votes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/live_consensus.json daily_impossible.json
            git commit -m "Aggregate web votes"
            git pull --rebase
            git push
          fi
