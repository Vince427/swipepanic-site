name: Remote content

on:
  schedule:
    # Weekly pack rotation.
    - cron: '17 3 * * 1'
    # Web votes: aggregated every 6h. Batching is what makes "git as the
    # database" viable - one commit per batch, not one per vote.
    - cron: '23 */6 * * *'
  workflow_dispatch:
  # Both triggers list data/live_consensus.json on purpose: deploy_consensus.js
  # tells a human to commit that file by hand, so the path a person actually
  # takes must be validated too - not only the paths the bots take. Without the
  # push trigger, a direct commit to main reaches the public site unchecked.
  push:
    branches: [main]
    paths: &content_paths
      - 'manifest.json'
      - 'daily.json'
      - 'daily_pool.json'
      - 'cards_patch.json'
      - 'blacklist.txt'
      - 'blacklist.json'
      - 'data/live_consensus.json'
      - 'scripts/**'
      - '.github/workflows/remote-content.yml'
  pull_request:
    paths: *content_paths

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check scripts/remote_content_rules.js
      - run: node --check scripts/validate_remote_content.js
      - run: node --check scripts/generate_daily.js
      - run: node --check scripts/play_contract.test.js
      - run: node --check scripts/aggregate_web_votes.js
      - run: node --test scripts/play_contract.test.js
      - run: node --test scripts/aggregate_web_votes.test.js
      - run: node --test scripts/live_consensus_validation.test.js
      - run: node scripts/validate_remote_content.js

  generate-weekly:
    if: github.event.schedule == '17 3 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/generate_daily.js
      - run: node scripts/validate_remote_content.js
      - name: Commit weekly content
        run: |
          if git diff --quiet -- daily.json; then
            echo "daily.json already current for this week"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add daily.json
            git commit -m "Update weekly remote content"
            git pull --rebase
            git push
          fi

  aggregate-web-votes:
    # Its own cron only: running alongside generate-weekly would mean two jobs
    # pushing the same branch at the same time.
    if: github.event.schedule == '23 */6 * * *'
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No-op while vote_config.json is absent, so this job is safe to enable
      # before the form exists.
      - run: node scripts/aggregate_web_votes.js

      # The aggregate must never be published without passing the same
      # validation as everything else.
      - run: node scripts/validate_remote_content.js

      - name: Commit aggregated votes
        run: |
          if git diff --quiet -- data/live_consensus.json; then
            echo "no new web votes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/live_consensus.json
            git commit -m "Aggregate web votes"
            git pull --rebase
            git push
          fi
